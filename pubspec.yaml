name: parkinsondetetion
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  permission_handler: ^12.0.0+1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  cloud_functions: ^5.4.0
  responsive_builder: ^0.7.0
  sensors_plus: ^3.0.3
  fftea: ^1.5.0+1
  fl_chart: ^0.64.0
  tflite_flutter: ^0.11.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  image: ^4.0.17
  record: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  http: ^1.1.0
  archive: ^4.0.7
  cognition_package: ^1.7.0
  research_package: ^2.0.0
  signature: ^5.5.0


dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.13.1  
  flutter_native_splash: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/loading_screen.png
    - assets/images/icon.png
    - assets/images/logo128x128.png    
    - assets/images/logo192x192.png
    - assets/tapping_model.tflite
    - assets/models/drawing_binary_classifier2.tflite
    - assets/models/kalo.tflite
    - assets/models/voice_norm.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"

flutter_native_splash:
  color: "#071833"
  android: true
  ios: false
  #image: assets/images/logo128x128.png   
  fullscreen: true
  android_gravity: center
  android_12:
    icon_background_color: "#071833"
    #image: assets/images/logo128x128.png   
